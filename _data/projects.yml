# Curated from public repositories at github.com/mchiovaro.
research:
  - title: "Nonlinear, natural, and noisy"
    label: "R · Behavioral time series"
    description: "A toolkit for categorical recurrence quantification and detrended fluctuation analysis, with scripts for preparing and analyzing real-world behavioral data."
    url: "https://github.com/mchiovaro/nonlinear-natural-noisy"
  - title: "Comparing time-series methods"
    label: "Quantitative research · Methods"
    description: "Companion code for a study comparing vector autoregression, cross-correlation, and cross-recurrence analysis in social cohesion and collective action."
    url: "https://github.com/mchiovaro/time-series-analyses"
  - title: "Social cohesion & collective action"
    label: "R · Published research"
    description: "Research code accompanying our PLOS ONE study of the relationship between online social cohesion and real-world action in Syria during the Arab Spring."
    url: "https://github.com/mchiovaro/arab-spring"
  - title: "Division of labor"
    label: "Experimental software · Analysis"
    description: "A research game and companion analysis repository developed for my dissertation on coordination, task constraints, and group efficiency."
    url: "https://github.com/mchiovaro/division-of-labor-game"
    secondary_url: "https://github.com/mchiovaro/division-of-labor-analyses"
    secondary_label: "Explore the analyses"
teaching:
  - title: "Introduction to R"
    label: "R Markdown · Guided lessons"
    description: "A course in R for the quantitative social sciences, pairing step-by-step explanations with code examples and opportunities to practice."
    url: "https://github.com/mchiovaro/Introduction-to-R"
  - title: "Interactive data with R Shiny"
    label: "Visualization · Workshop resources"
    description: "Tutorial applications created for a Science of Learning and Art of Communication workshop on R Shiny, data visualization, and collection."
    url: "https://github.com/mchiovaro/R-Shiny-tutorial"
  - title: "Introduction to machine learning"
    label: "Python · Teaching notebooks"
    description: "Code-along lessons covering data preparation, regression, classification, clustering, and neural networks for engineering students."
    url: "https://github.com/mchiovaro/Introduction-to-ML"
  - title: "Advanced machine learning"
    label: "PyTorch · Student workshops"
    description: "Course notebooks on convolutional and recurrent networks, transformers, optimization, and natural language processing, alongside student-led workshops."
    url: "https://github.com/mchiovaro/Advanced-Machine-Learning"
