<div class="resource-grid">
{% for project in include.projects %}
  <article class="resource-card">
    <p class="card-label">{{ project.label }}</p>
    <h3>{{ project.title }}</h3>
    <p>{{ project.description }}</p>
    <div class="card-links">
      <a href="{{ project.url }}">Explore on GitHub <span aria-hidden="true">&rarr;</span></a>
      {% if project.secondary_url %}<a href="{{ project.secondary_url }}">{{ project.secondary_label }} <span aria-hidden="true">&rarr;</span></a>{% endif %}
    </div>
  </article>
{% endfor %}
</div>
